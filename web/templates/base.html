<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Trading Bot{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css?v=27" />
</head>
<body>
  {% if user %}
  <header class="topbar">
    <nav>
      <a href="/" class="{% if active == 'explorer' %}active{% endif %}">Explorer</a>
      <a href="/backtest" class="{% if active == 'backtest' %}active{% endif %}">Backtest</a>
      <a href="/paper" class="{% if active == 'paper' %}active{% endif %}">Paper</a>
      <a href="/replay" class="{% if active == 'replay' %}active{% endif %}">Replay</a>
      <a href="/patterns" class="{% if active == 'patterns' %}active{% endif %}">Patterns</a>
      <a href="/indicators" class="{% if active == 'indicators' %}active{% endif %}">Indicators</a>
      <a href="/builder" class="{% if active == 'builder' %}active{% endif %}">Builder</a>
      <a href="/laya" class="{% if active == 'laya' %}active{% endif %}">Laya</a>
      <a href="/system" class="{% if active == 'system' %}active{% endif %}">System</a>
      {% if hermes_enabled %}<a href="/hermes" class="{% if active == 'hermes' %}active{% endif %}">Hermes</a>{% endif %}
      <a href="/kronos" class="{% if active == 'kronos' %}active{% endif %}">Kronos</a>
      <a href="/docs" class="{% if active == 'docs' %}active{% endif %}">Documentation</a>
      {% if tasks_enabled %}<a href="/tasks" class="{% if active == 'tasks' %}active{% endif %}">Tasks</a>{% endif %}
    </nav>
    <div class="topbar-right">
      <a href="/paper" class="book-lamps" id="book-lamps" title="Paper books">
        <span data-book="us">US<i class="lamp"></i></span>
        <span data-book="ph">PH<i class="lamp"></i></span>
      </a>
      <span class="muted">{{ user }}</span>
      <form method="post" action="/logout" class="inline">
        <button type="submit" class="btn ghost">Logout</button>
      </form>
    </div>
  </header>
  {% endif %}
  <main class="{% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js?v=28"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
