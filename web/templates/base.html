<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Trading Bot{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css?v=5" />
</head>
<body>
  {% if user %}
  <header class="topbar">
    <nav>
      <a href="/" class="{% if active == 'explorer' %}active{% endif %}">Explorer</a>
      <a href="/backtest" class="{% if active == 'backtest' %}active{% endif %}">Backtest</a>
      <a href="/paper" class="{% if active == 'paper' %}active{% endif %}">Paper</a>
    </nav>
    <div class="topbar-right">
      <span class="muted">{{ user }}</span>
      <form method="post" action="/logout" class="inline">
        <button type="submit" class="btn ghost">Logout</button>
      </form>
    </div>
  </header>
  {% endif %}
  <main class="{% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js?v=5"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
